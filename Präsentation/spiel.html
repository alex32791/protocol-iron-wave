                                                                                                                                                                                        class Defender {
                                                                                                                                                                                        	    constructor(x, y, type) {
                                                                                                                                                                                        	    	        this.x = x;
                                                                                                                                                                                        	    	                this.y = y;
                                                                                                                                                                                        	    	                        this.type = type;
                                                                                                                                                                                        	    	                                this.range = type === 'artillery' ? 380 : (type === 'sniper' ? 550 : 180);

                                                                                                                                                                                        	    	                                                        this.damage = type === 'artillery' ? 45 : (type === 'sniper' ? 90 : 14);
                                                                                                                                                                                        	    	                                                            }
                                                                                                                                                                                        	    	                                                                update() {

                                                                                                                                                                                        	    	                                                                	                	                        	                                this.cooldown = this.fireRate;
                                                                                                                                                                                        	    	                                                                	                	                        	                                            }
                                                                                                                                                                                        	    	                                                                	                	                        	                                                    }

                                                                                                                                                                                        	    	                                                                	                	                        	                                                            	                                                            	    	                                        	                                                                                	                                                                                	                                                                                                update() {

                                                                                                                                                                                        	    	                                                                	                	                        	                                                            	                                                            	    	                                        	                                                                                	                                                                                	                                                                                                	                if (!blocked) {
                                                                                                                                                                                        	    	                                                                	                	                        	                                                            	                                                            	    	                                        	                                                                                	                                                                                	                                                                                                	                	            this.x -= this.speed;

                                                                                                                                                                                        	    	                                                                	                	                        	                                                            	                                                            	    	                                        	                                                                                	                                                                                	                                                                                                	                	                    	                        	                                if (b.hp <= 0) barricades = barricades.filter(barr => barr !== b);

                                                                                                                                                                                        	    	                                                                	                	                        	                                                            	                                                            	    	                                        	                                                                                	                                                                                	                                                                                                	                	                    	                        	                                                    }

                                                                                                                                                                                        	    	                                                                	                	                        	                                                            	                                                            	    	                                        	                                                                                	                                                                                	                                                                                                	                	                    	                        	                                                            	            hqHealth -= this.type === 'tank' ? 25 : 10;
                                                                                                                                                                                        	    	                                                                	                	                        	                                                            	                                                            	    	                                        	                                                                                	                                                                                	                                                                                                	                	                    	                        	                                                            	                        this.hp = 0;

                                                                                                                                                                                        	    	                                                                	                	                        	                                                            	                                                            	    	                                        	                                                                                	                                                                                	                                                                                                	                	                    	                        	                                                            	                                                    draw() {
                                                                                                                                                                                        	    	                                                                	                	                        	                                                            	                                                            	    	                                        	                                                                                	                                                                                	                                                                                                	                	                    	                        	                                                            	                                                    	        ctx.fillStyle = this.color;
                                                                                                                                                                                        	    	                                                                	                	                        	                                                            	                                                            	    	                                        	                                                                                	                                                                                	                                                                                                	                	                    	                        	                                                            	                                                    	                ctx.fillRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);

                                                                                                                                                                                        	    	                                                                	                	                        	                                                            	                                                            	    	                                        	                                                                                	                                                                                	                                                                                                	                	                    	                        	                                                            	                                                    	                                                                    	    constructor(x, y, target, damage, shooterType) {

                                                                                                                                                                                        	    	                                                                	                	                        	                                                            	                                                            	    	                                        	                                                                                	                                                                                	                                                                                                	                	                    	                        	                                                            	                                                    	                                                                    	    	                                                        	                                	                                                                            	                                    }

                                                                                                                                                                                        	    	                                                                	                	                        	                                                            	                                                            	    	                                        	                                                                                	                                                                                	                                                                                                	                	                    	                        	                                                            	                                                    	                                                                    	    	                                                        	                                	                                                                            	                                    	    constructor(x, y) {
